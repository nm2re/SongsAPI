<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Re;vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #080808;
            --surface: #111111;
            --border: #1e1e1e;
            --border-bright: #2e2e2e;
            --text: #e8e8e8;
            --muted: #555;
            --accent: #c8ff00;
            --accent-dim: #8aad00;
            --red: #ff4444;
            --green: #00ff88;
            --blue: #00aaff;
            --orange: #ff8800;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: 'DM Mono', monospace;
            min-height: 100vh;
            padding: 0;
            overflow-x: hidden;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
            pointer-events: none;
            z-index: 1000;
            opacity: 0.4;
        }

        header {
            border-bottom: 1px solid var(--border);
            padding: 24px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 2rem;
            letter-spacing: 0.15em;
            color: var(--accent);
        }

        .logo span {
            color: var(--muted);
            font-size: 0.75rem;
            font-family: 'DM Mono', monospace;
            letter-spacing: 0.2em;
            display: block;
            margin-top: -4px;
        }

        .status-bar {
            font-size: 11px;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .status-bar .dot {
            display: inline-block;
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent);
            margin-right: 6px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        main {
            max-width: 1080px;
            margin: 0 auto;
            padding: 48px 40px;
        }

        .search-section { margin-bottom: 48px; }

        .search-label {
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 12px;
        }

        .search-row {
            display: flex;
            gap: 0;
            border: 1px solid var(--border-bright);
            background: var(--surface);
            transition: border-color 0.2s;
        }

        .search-row:focus-within { border-color: var(--accent); }

        .search-row input {
            flex: 1;
            background: transparent;
            border: none;
            color: var(--text);
            padding: 14px 20px;
            font-family: 'DM Mono', monospace;
            font-size: 14px;
            outline: none;
            letter-spacing: 0.05em;
        }

        .search-row input::placeholder { color: var(--muted); }

        .search-row button {
            background: var(--accent);
            border: none;
            color: #000;
            padding: 14px 28px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.1rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: background 0.15s;
        }

        .search-row button:hover { background: #d9ff1a; }
        .search-row button:active { background: var(--accent-dim); }

        .results-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .results-label {
            font-size: 10px;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--muted);
        }

        .results-count {
            font-size: 11px;
            color: var(--accent);
            letter-spacing: 0.1em;
        }

        .album-card {
            border: 1px solid var(--border);
            background: var(--surface);
            margin-bottom: 2px;
            transition: border-color 0.15s, background 0.15s;
            animation: slideIn 0.3s ease both;
        }

        .album-card:hover {
            border-color: var(--border-bright);
            background: #161616;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .album-card-inner {
            padding: 16px 20px;
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .album-index {
            font-size: 11px;
            color: var(--muted);
            width: 24px;
            text-align: right;
            flex-shrink: 0;
        }

        .album-info {
            flex: 1;
            min-width: 0;
        }

        .album-name {
            font-size: 14px;
            color: var(--text);
            letter-spacing: 0.03em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-weight: 500;
        }

        .album-meta {
            font-size: 11px;
            color: var(--muted);
            margin-top: 3px;
            letter-spacing: 0.05em;
        }

        .album-year {
            color: var(--accent-dim);
            margin-left: 8px;
        }

        .album-actions {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-shrink: 0;
            flex-wrap: wrap;
            justify-content: flex-end;
        }

        .btn {
            border: 1px solid var(--border-bright);
            background: transparent;
            color: var(--muted);
            padding: 7px 14px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.15s;
            text-transform: uppercase;
        }

        .btn:hover {
            border-color: var(--accent);
            color: var(--accent);
        }

        .btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
            border-color: var(--border);
            color: var(--muted);
        }

        .btn-move:hover {
            border-color: #888;
            color: var(--text);
        }

        .btn-convert:hover {
            border-color: var(--blue);
            color: var(--blue);
        }

        .btn-rename:hover {
            border-color: var(--orange);
            color: var(--orange);
        }

        .overwrite-toggle {
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 4px 0;
        }

        .overwrite-toggle input[type="checkbox"] {
            appearance: none;
            width: 14px;
            height: 14px;
            border: 1px solid var(--border-bright);
            background: transparent;
            cursor: pointer;
            position: relative;
            flex-shrink: 0;
            transition: all 0.15s;
        }

        .overwrite-toggle input[type="checkbox"]:checked {
            background: var(--accent);
            border-color: var(--accent);
        }

        .overwrite-toggle input[type="checkbox"]:checked::after {
            content: '';
            position: absolute;
            left: 3px;
            top: 1px;
            width: 5px;
            height: 8px;
            border: 2px solid #000;
            border-top: none;
            border-left: none;
            transform: rotate(45deg);
        }

        .overwrite-label {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            user-select: none;
        }

        .status-tag {
            font-size: 10px;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 4px 10px;
            border: 1px solid transparent;
            white-space: nowrap;
        }

        .status-tag.downloading { color: var(--accent); border-color: var(--accent-dim); }
        .status-tag.done        { color: var(--green);  border-color: #004422; }
        .status-tag.error       { color: var(--red);    border-color: #440000; }
        .status-tag.moving      { color: #888;          border-color: #333; }
        .status-tag.moved       { color: var(--text);   border-color: #333; }
        .status-tag.converting  { color: var(--blue);   border-color: #003355; }
        .status-tag.converted   { color: var(--blue);   border-color: #003355; }
        .status-tag.renaming    { color: var(--orange);  border-color: #442200; }
        .status-tag.renamed     { color: var(--orange);  border-color: #442200; }

        .log-box {
            border-top: 1px solid var(--border);
            background: #050505;
            color: var(--accent);
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            padding: 12px 20px 12px 64px;
            max-height: 160px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;  /* Break long lines */
            display: none;
            line-height: 1.4;
            letter-spacing: 0.03em;
        }

        .log-box::-webkit-scrollbar { width: 4px; }
        .log-box::-webkit-scrollbar-track { background: transparent; }
        .log-box::-webkit-scrollbar-thumb { background: var(--border-bright); }

        /* Rename modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 2000;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.15s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .modal {
            background: var(--surface);
            border: 1px solid var(--border-bright);
            padding: 32px;
            width: 480px;
            max-width: 90vw;
            animation: slideUp 0.2s ease;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-title {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1.4rem;
            letter-spacing: 0.15em;
            color: var(--orange);
            margin-bottom: 4px;
        }

        .modal-subtitle {
            font-size: 10px;
            color: var(--muted);
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 24px;
        }

        .modal-field {
            margin-bottom: 16px;
        }

        .modal-field label {
            display: block;
            font-size: 10px;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--muted);
            margin-bottom: 6px;
        }

        .modal-field input {
            width: 100%;
            background: #0a0a0a;
            border: 1px solid var(--border-bright);
            color: var(--text);
            padding: 10px 14px;
            font-family: 'DM Mono', monospace;
            font-size: 13px;
            outline: none;
            letter-spacing: 0.03em;
            transition: border-color 0.15s;
        }

        .modal-field input:focus {
            border-color: var(--orange);
        }

        .modal-actions {
            display: flex;
            gap: 8px;
            margin-top: 24px;
            justify-content: flex-end;
        }

        .btn-modal-cancel {
            border: 1px solid var(--border-bright);
            background: transparent;
            color: var(--muted);
            padding: 9px 20px;
            font-family: 'DM Mono', monospace;
            font-size: 11px;
            letter-spacing: 0.1em;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.15s;
        }

        .btn-modal-cancel:hover {
            border-color: var(--red);
            color: var(--red);
        }

        .btn-modal-confirm {
            border: none;
            background: var(--orange);
            color: #000;
            padding: 9px 24px;
            font-family: 'Bebas Neue', sans-serif;
            font-size: 1rem;
            letter-spacing: 0.15em;
            cursor: pointer;
            transition: background 0.15s;
        }

        .btn-modal-confirm:hover { background: #ffaa33; }
        .btn-modal-confirm:active { background: #cc6600; }

        /* staggered animation delays */
        .album-card:nth-child(1)  { animation-delay: 0ms; }
        .album-card:nth-child(2)  { animation-delay: 40ms; }
        .album-card:nth-child(3)  { animation-delay: 80ms; }
        .album-card:nth-child(4)  { animation-delay: 120ms; }
        .album-card:nth-child(5)  { animation-delay: 160ms; }
        .album-card:nth-child(6)  { animation-delay: 200ms; }
        .album-card:nth-child(7)  { animation-delay: 240ms; }
        .album-card:nth-child(8)  { animation-delay: 280ms; }
        .album-card:nth-child(9)  { animation-delay: 320ms; }
        .album-card:nth-child(10) { animation-delay: 360ms; }

        .empty-state {
            text-align: center;
            padding: 60px 0;
            color: var(--muted);
            font-size: 12px;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }

        .empty-state .big {
            font-family: 'Bebas Neue', sans-serif;
            font-size: 4rem;
            color: #1a1a1a;
            letter-spacing: 0.2em;
            display: block;
            margin-bottom: 12px;
        }

        #downloadsPanel {
            max-height: calc(100vh - 60px);
            overflow-y: auto;
        }

        #downloadsPanel::-webkit-scrollbar {
            width: 4px;
        }

        #downloadsPanel::-webkit-scrollbar-track {
            background: transparent;
        }

        #downloadsPanel::-webkit-scrollbar-thumb {
            background: var(--border-bright);
            border-radius: 2px;
        }

        #downloadsList {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .download-item {
            padding: 12px;
            border: 1px solid var(--border);
            background: #0a0a0a;
            border-radius: 2px;
        }

        .download-item-title {
            color: var(--text);
            font-weight: 500;
            font-size: 12px;
            margin-bottom: 4px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .download-item-artist {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 6px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .download-item-progress {
            font-size: 10px;
            color: var(--accent);
            letter-spacing: 0.05em;
            text-transform: uppercase;
            font-weight: 500;
        }
    </style>
</head>
<body>

<header>
    <div class="logo">
        RE;VAULT
        <span>Apple Music Downloader</span>
    </div>
    <div class="status-bar">
        <span class="dot"></span>API READY — localhost:8000
    </div>

    <div class="header-actions" id="headerActions">
        <!-- Admin button — shown only for admins -->
        <button id="adminBtn" style="display:none; border: 1px solid #555; background: transparent; color: #888; padding: 6px 12px; font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.15s;"
                onclick="window.location.href='/admin'"
                onmouseover="this.style.borderColor='var(--accent)'; this.style.color='var(--accent)'"
                onmouseout="this.style.borderColor='#555'; this.style.color='#888'">
            ADMIN
        </button>

        <!-- Downloads button -->
        <button id="downloadsBtn" style="border: 1px solid #555; background: transparent; color: #888; padding: 6px 12px; font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.15s;"
                onclick="toggleDownloads()"
                onmouseover="this.style.borderColor='var(--accent)'; this.style.color='var(--accent)'"
                onmouseout="this.style.borderColor='#555'; this.style.color='#888'">
            DOWNLOADS (<span id="downloadCount">0</span>)
        </button>

        <button style="border: 1px solid #555; background: transparent; color: #888; padding: 6px 12px; font-family: 'DM Mono', monospace; font-size: 11px; cursor: pointer; letter-spacing: 0.1em; text-transform: uppercase; transition: all 0.15s;"
                onclick="logout()"
                onmouseover="this.style.borderColor='var(--accent)'; this.style.color='var(--accent)'"
                onmouseout="this.style.borderColor='#555'; this.style.color='#888'">
            LOGOUT
        </button>
    </div>

    <!-- Downloads panel — slides in from the right -->
    <div id="downloadsPanel" style="position: fixed; right: -400px; top: 60px; width: 400px; height: calc(100vh - 60px); background: var(--surface); border-left: 1px solid var(--border); padding: 20px; overflow-y: auto; transition: right 0.3s; z-index: 999;">
        <div style="font-family: 'Bebas Neue', sans-serif; font-size: 1.2rem; letter-spacing: 0.15em; margin-bottom: 20px; color: var(--accent);">DOWNLOADS</div>
        <div id="downloadsList" style="font-size: 12px; color: var(--muted);">No active downloads</div>
    </div>
</header>

<main>
    <div class="search-section">
        <div class="search-label">Search Albums</div>
        <div class="search-row">
            <input
                    autocomplete="off"
                    type="text"
                    id="searchInput"
                    placeholder="Artist or album name..."
                    onkeydown="if(event.key==='Enter') searchAlbums()"
            >
            <button onclick="searchAlbums()">Search</button>
        </div>
    </div>

    <div class="search-section">
        <div class="search-label">Or paste Apple Music URL</div>
        <div class="search-row">
            <input
                    autocomplete="off"
                    type="text"
                    id="lookupInput"
                    placeholder="https://music.apple.com/us/album/name/123456..."
                    onkeydown="if(event.key==='Enter') lookupByUrl()"
            >
            <button onclick="lookupByUrl()">Lookup</button>
        </div>
    </div>

    <!-- Pinned downloads section -->
    <div id="pinnedSection" style="display:none; margin-bottom: 32px;">
        <div class="results-header">
            <span class="results-label">Active Downloads</span>
            <span class="results-count" id="pinnedCount">0</span>
        </div>
        <div id="pinnedDownloads"></div>
    </div>

    <!-- Search results section -->
    <div id="results">
        <div class="empty-state">
            <span class="big">SEARCH</span>
            Enter an artist or album above to get started
        </div>
    </div>
</main>

<!-- Rename Modal -->
<div class="modal-overlay" id="renameModal" style="display:none;" onclick="closeRenameModal(event)">
    <div class="modal">
        <div class="modal-title">Rename Album</div>
        <div class="modal-subtitle">Update folder name and metadata</div>
        <div class="modal-field">
            <label>Artist</label>
            <input autocomplete=off type="text" id="renameArtist" placeholder="Artist name">
        </div>
        <div class="modal-field">
            <label>Album Name</label>
            <input autocomplete=off type="text" id="renameAlbum" placeholder="Album name">
        </div>
        <div class="modal-actions">
            <button class="btn-modal-cancel" onclick="closeRenameModal()">Cancel</button>
            <button class="btn-modal-confirm" onclick="confirmRename()">Rename</button>
        </div>
    </div>
</div>

<script>

    let currentDownloads = {};

    // Check if user is admin on page load
    async function checkAdmin() {
        try {
            const response = await fetch("http://localhost:8000/api/user-info");
            const data = await response.json();

            if (data.is_admin) {
                document.getElementById("adminBtn").style.display = "block";
            }
        } catch (err) {
            console.error("Error checking admin status:", err);
        }
    }

    function toggleDownloads() {
        const panel = document.getElementById("downloadsPanel");
        if (panel.style.right === "0px") {
            panel.style.right = "-400px";
        } else {
            panel.style.right = "0px";
        }
    }

    function addDownload(collectionId, albumName, artist) {
        currentDownloads[collectionId] = {
            id: collectionId,
            albumName: albumName,
            artist: artist,
            status: "downloading",
            startTime: new Date()
        };
        console.log("Added to downloads:", collectionId, currentDownloads);
        updateDownloadsPanel();
    }

    function updateDownloadStatus(collectionId, status) {
        if (currentDownloads[collectionId]) {
            currentDownloads[collectionId].status = status;
            updateDownloadsPanel();

            // Only remove completed items after a delay
            if (status === "done" || status === "error") {
                setTimeout(() => {
                    delete currentDownloads[collectionId];
                    updateDownloadsPanel();
                }, 5000); // Show for 5 seconds after completion
            }
        }
    }

    function updateDownloadsPanel() {
        const list = document.getElementById("downloadsList");
        const downloads = Object.values(currentDownloads);
        const count = downloads.length;

        document.getElementById("downloadCount").textContent = count;

        if (count === 0) {
            list.innerHTML = '<div style="color: var(--muted); font-size: 12px; padding: 12px;">No active downloads</div>';
            return;
        }

        list.innerHTML = downloads.map(dl => {
            let statusColor = 'var(--accent)';
            let statusText = dl.status.toUpperCase();

            if (dl.status === 'done') {
                statusColor = '#00ff00';
                statusText = '✓ DONE';
            }
            if (dl.status === 'error') {
                statusColor = '#ff0000';
                statusText = '✗ ERROR';
            }
            if (dl.status === 'converting') {
                statusColor = '#ffaa00';
                statusText = '⟳ CONVERTING';
            }

            return `
            <div class="download-item">
                <div class="download-item-title">${dl.albumName}</div>
                <div class="download-item-artist">${dl.artist}</div>
                <div class="download-item-progress" style="color: ${statusColor};">${statusText}</div>
            </div>
        `;
        }).join("");
    }

    async function logout() {
        await fetch("http://localhost:8000/api/logout", { method: "POST" });
        window.location.href = "/login";
    }

    // Check admin on page load
    checkAdmin();


    let currentResults = [];
    let pinnedAlbums = new Set();
    let pinnedAlbumsDetails = {};  // Store details for all pinned albums
    let downloadLogs = {};
    let renameTarget = null;

    function saveState() {
        localStorage.setItem("pinnedAlbums", JSON.stringify(Array.from(pinnedAlbums)));
        localStorage.setItem("pinnedAlbumsDetails", JSON.stringify(pinnedAlbumsDetails));
        localStorage.setItem("currentResults", JSON.stringify(currentResults));
        localStorage.setItem("downloadLogs", JSON.stringify(downloadLogs));
    }

    function restoreState() {
        const saved = localStorage.getItem("pinnedAlbums");
        const savedDetails = localStorage.getItem("pinnedAlbumsDetails");
        const savedResults = localStorage.getItem("currentResults");
        const savedLogs = localStorage.getItem("downloadLogs");

        if (savedResults) {
            currentResults = JSON.parse(savedResults);
        }

        if (savedDetails) {
            pinnedAlbumsDetails = JSON.parse(savedDetails);
        }

        if (savedLogs) {
            downloadLogs = JSON.parse(savedLogs);
        }

        if (saved) {
            const pinned = JSON.parse(saved);
            const pinnedSection = document.getElementById("pinnedSection");
            const pinnedDownloads = document.getElementById("pinnedDownloads");

            pinned.forEach(id => {
                // Get album details from pinnedAlbumsDetails, not currentResults
                const album = pinnedAlbumsDetails[id];
                if (album) {
                    pinnedAlbums.add(id);
                    createAlbumCard(album, pinnedDownloads);

                    // Determine status from logs
                    let status = "downloading";
                    if (downloadLogs[id]) {
                        if (downloadLogs[id].includes("[DONE]")) {
                            status = "done";
                        } else if (downloadLogs[id].includes("[ERROR]")) {
                            status = "error";
                        }
                    }

                    // Restore to downloads panel
                    addDownload(id, album.album_name, album.artist);
                    currentDownloads[id].status = status;

                    // Restore log content and status
                    setTimeout(() => {
                        const logBox = document.getElementById(`log-${id}`);
                        const statusEl = document.getElementById(`status-${id}`);

                        if (logBox && downloadLogs[id]) {
                            logBox.style.display = "block";
                            logBox.textContent = downloadLogs[id];
                            logBox.scrollTop = logBox.scrollHeight;
                        }

                        if (statusEl) {
                            if (status === "done") {
                                statusEl.className = "status-tag done";
                                statusEl.textContent = "✓ Downloaded";
                            } else if (status === "error") {
                                statusEl.className = "status-tag error";
                                statusEl.textContent = "✗ Error";
                            } else if (downloadLogs[id] && downloadLogs[id].includes("[CONVERT]")) {
                                statusEl.className = "status-tag converting";
                                statusEl.textContent = "Converting";
                            } else {
                                statusEl.className = "status-tag downloading";
                                statusEl.textContent = "Downloading";
                            }
                        }
                    }, 100);
                }
            });

            if (pinnedAlbums.size > 0) {
                pinnedSection.style.display = "block";
                document.getElementById("pinnedCount").textContent = pinnedAlbums.size;
            }

            updateDownloadsPanel();
        }
    }

    function pinAlbum(collectionId, album) {

        const pinnedSection = document.getElementById("pinnedSection");

    async function downloadAlbum(collectionId) {
        // Get album from pinnedAlbumsDetails (persisted) or currentResults (current search)
        let album = currentResults.find(r => r.collection_id === collectionId);
        if (!album && pinnedAlbumsDetails[collectionId]) {
            album = pinnedAlbumsDetails[collectionId];
        }

        if (!album) {
            console.error("Album not found:", collectionId);
            return;
        }

        // Pin this album to the top
        pinAlbum(collectionId, album);

        addDownload(collectionId, album.album_name, album.artist);

        const statusEl = document.getElementById(`status-${collectionId}`);
        const logBox = document.getElementById(`log-${collectionId}`);
        const btn = document.getElementById(`dl-btn-${collectionId}`);

        btn.disabled = true;
        logBox.style.display = "block";
        logBox.textContent = "";
        downloadLogs[collectionId] = "";
        statusEl.className = "status-tag downloading";
        statusEl.textContent = "Downloading";

        const response = await fetch("http://localhost:8000/albums/download", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            credentials: "include",
            body: JSON.stringify({
                collection_id: collectionId,
                results: currentResults.length > 0 ? currentResults : [album]
            })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = "";

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            buffer += decoder.decode(value);
            const lines = buffer.split("\n");
            buffer = lines.pop() || "";

            for (const line of lines) {
                const trimmed = line.trim();
                if (!trimmed.startsWith("data: ")) continue;

                const content = trimmed.replace("data: ", "").trim();
                if (!content) continue;

                if (content === "[DONE]") {
                    statusEl.className = "status-tag done";
                    statusEl.textContent = "✓ Downloaded";
                    btn.disabled = false;
                    updateDownloadStatus(collectionId, "done");
                    saveState();
                    showActions(collectionId);
                    return;
                }

                if (content.startsWith("[ERROR]")) {
                    statusEl.className = "status-tag error";
                    statusEl.textContent = "✗ Error";
                    updateDownloadStatus(collectionId, "error");
                    logBox.textContent += content + "\n";
                    downloadLogs[collectionId] = logBox.textContent;
                    saveState();
                    btn.disabled = false;
                    return;
                }

                logBox.textContent += content + "\n";
                downloadLogs[collectionId] = logBox.textContent;
                saveState();
                logBox.scrollTop = logBox.scrollHeight;
            }
        }
    }

    async function convertAlbum(artist, albumName, collectionId) {
        const statusEl = document.getElementById(`status-${collectionId}`);
        const logBox   = document.getElementById(`log-${collectionId}`);

        if (!statusEl || !logBox) {
            console.error("Album elements not found for:", collectionId);
            return;
        }

        logBox.style.display = "block";
        logBox.textContent += "\n[CONVERT] Starting conversion...\n";
        downloadLogs[collectionId] = logBox.textContent;
        statusEl.className = "status-tag converting";
        statusEl.textContent = "Converting";

        // Update downloads panel
        if (currentDownloads[collectionId]) {
            currentDownloads[collectionId].status = "converting";
            updateDownloadsPanel();
        }

        try {
            const response = await fetch("http://localhost:8000/albums/convert-flac", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                credentials: "include",
                body: JSON.stringify({ artist, album_name: albumName })
            });

            const reader  = response.body.getReader();
            const decoder = new TextDecoder();
            let buffer = "";

            while (true) {
                const { done, value } = await reader.read();
                if (done) break;

                buffer += decoder.decode(value);
                const lines = buffer.split("\n");
                buffer = lines.pop() || "";

                for (const line of lines) {
                    if (!line.trim().startsWith("data: ")) continue;

                    const content = line.replace("data: ", "").trim();
                    if (!content) continue;

                    if (content === "[DONE]") {
                        statusEl.className = "status-tag done";
                        statusEl.textContent = "✓ Converted";
                        logBox.textContent += content + "\n";
                        downloadLogs[collectionId] = logBox.textContent;

                        // Update downloads panel
                        if (currentDownloads[collectionId]) {
                            currentDownloads[collectionId].status = "done";
                            updateDownloadsPanel();
                        }

                        saveState();
                        return;
                    }

                    if (content.startsWith("[ERROR]")) {
                        statusEl.className = "status-tag error";
                        statusEl.textContent = "✗ Error";
                        logBox.textContent += content + "\n";
                        downloadLogs[collectionId] = logBox.textContent;

                        // Update downloads panel
                        if (currentDownloads[collectionId]) {
                            currentDownloads[collectionId].status = "error";
                            updateDownloadsPanel();
                        }

                        saveState();
                        return;
                    }

                    logBox.textContent += content + "\n";
                    downloadLogs[collectionId] = logBox.textContent;
                    saveState();
                    logBox.scrollTop = logBox.scrollHeight;
                }
            }
        } catch (err) {
            statusEl.className = "status-tag error";
            statusEl.textContent = "✗ Failed";
            logBox.textContent += `[ERROR] ${err.message}\n`;
            downloadLogs[collectionId] = logBox.textContent;

            // Update downloads panel
            if (currentDownloads[collectionId]) {
                currentDownloads[collectionId].status = "error";
                updateDownloadsPanel();
            }

            saveState();
        }
    }

    async function moveAlbum(artist, albumName, collectionId) {
        const statusEl = document.getElementById(`status-${collectionId}`);
        const logBox   = document.getElementById(`log-${collectionId}`);
        const overwrite = document.getElementById(`overwrite-${collectionId}`).checked;

        statusEl.className = "status-tag moving";
        statusEl.textContent = "Moving...";

        if (currentDownloads[collectionId]) {
            currentDownloads[collectionId].status = "moving";
            updateDownloadsPanel();
        }

        const response = await fetch("http://localhost:8000/albums/move-album", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ artist, album_name: albumName, overwrite })
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const text = decoder.decode(value);
            const lines = text.split("\n").filter(l => l.startsWith("data: "));

            for (const line of lines) {
                const content = line.replace("data: ", "").trim();

                if (content === "[DONE]") {
                    statusEl.className = "status-tag done";
                    statusEl.textContent = "✓ Moved";

                    // Remove from active downloads, add to completed in panel
                    if (currentDownloads[collectionId]) {
                        const dl = currentDownloads[collectionId];
                        delete currentDownloads[collectionId];

                        const list = document.getElementById("downloadsList");
                        const completed = document.createElement("div");
                        completed.className = "download-item";
                        completed.innerHTML = `
                        <div class="download-item-title">${dl.albumName}</div>
                        <div class="download-item-artist">${dl.artist}</div>
                        <div class="download-item-progress" style="color: var(--green);">✓ MOVED TO VAULT</div>
                    `;
                        // Prepend so it appears at the top
                        list.insertBefore(completed, list.firstChild);
                        document.getElementById("downloadCount").textContent = Object.keys(currentDownloads).length;
                    }

                    // Remove the items from the pinned section
                    const pinnedCard = document.querySelector(`#pinnedDownloads #album-${collectionId}`);
                    if (pinnedCard) pinnedCard.remove();

                    pinnedAlbums.delete(collectionId);
                    delete pinnedAlbumsDetails[collectionId];
                    delete downloadLogs[collectionId];

                    if (pinnedAlbums.size === 0) {
                        document.getElementById("pinnedSection").style.display = "none";
                    }
                    document.getElementById("pinnedCount").textContent = pinnedAlbums.size;

                    if (logBox) {
                        logBox.textContent += "[MOVE] Complete\n";
                        downloadLogs[collectionId] = logBox.textContent;
                    }
                    saveState();
                    return;
                }

                if (content.startsWith("[ERROR]")) {
                    statusEl.className = "status-tag error";
                    statusEl.textContent = "✗ Error";

                    if (currentDownloads[collectionId]) {
                        currentDownloads[collectionId].status = "error";
                        updateDownloadsPanel();
                    }

                    if (logBox) {
                        logBox.textContent += content + "\n";
                        downloadLogs[collectionId] = logBox.textContent;
                    }
                    saveState();
                    return;
                }
            }
        }
    }

            body: JSON.stringify({
                artist: artist,
                album_name: albumName,
                new_artist: artist,
                new_album_name: albumName
            })
        });

     // ALL IN ONE BUTTON TO UPLOAD THE ALBUM (PERFORM ALL 4 STEPS)
    async function uploadAlbum(collectionId) {
        // Get album from currentResults or pinnedAlbumsDetails
        let album = currentResults.find(r => r.collection_id === collectionId);
        if (!album && pinnedAlbumsDetails[collectionId]) {
            album = pinnedAlbumsDetails[collectionId];
        }

            return;

        const logBox = document.getElementById(`log-${collectionId}`);

        downloadLogs[collectionId] = logBox.textContent;

        statusEl.className = "status-tag downloading";
        statusEl.textContent = "Uploading...";

        const escaped = (s) => s.replace(/'/g, "\\'");
        const artist = album.artist;
        const albumName = album.album_name;

        try {
            // Step 1: Download
            logBox.textContent += "\n[STEP 1/4] Downloading album...\n";
            downloadLogs[collectionId] = logBox.textContent;
            saveState();

            await downloadAlbumStep(collectionId, album);
            logBox.textContent += "[STEP 1/4] ✓ Download complete\n";

            saveState();

            // Step 2: Rename (Without Modal)

            saveState();

            await renameAlbumDirect(artist, albumName, collectionId);
            logBox.textContent += "[STEP 2/4] ✓ Rename complete\n";
            downloadLogs[collectionId] = logBox.textContent;
            saveState();

            // Step 3: Convert
            logBox.textContent += "\n[STEP 3/4] Converting to FLAC...\n";
            downloadLogs[collectionId] = logBox.textContent;
            saveState();

            await convertAlbumStep(collectionId, artist, albumName);
            logBox.textContent += "[STEP 3/4] ✓ Conversion complete\n";
            downloadLogs[collectionId] = logBox.textContent;
            saveState();

            // Step 4: Move

            downloadLogs[collectionId] = logBox.textContent;

            downloadLogs[collectionId] = logBox.textContent;
            statusEl.className = "status-tag error";
            statusEl.textContent = "✗ Failed";
            saveState();
        }
    }

    // Individual step functions that return promises
    async function downloadAlbumStep(collectionId, album) {
        return new Promise((resolve, reject) => {
            const logBox = document.getElementById(`log-${collectionId}`);
            const originalDownloadAlbum = downloadAlbum;

            // Intercept and wrap downloadAlbum to resolve when done
            (async () => {
                try {
                    const response = await fetch("http://localhost:8000/albums/download", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        credentials: "include",
                        body: JSON.stringify({
                            collection_id: collectionId,
                            results: [album]
                        })
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value);
                        const lines = buffer.split("\n");
                        buffer = lines.pop() || "";

                        for (const line of lines) {
                            const trimmed = line.trim();
                            if (!trimmed.startsWith("data: ")) continue;

                            const content = trimmed.replace("data: ", "").trim();
                            if (!content) continue;

                            if (content === "[DONE]") {
                                updateDownloadStatus(collectionId, "done");
                                resolve();
                                return;

    async function renameAlbumStep(collectionId, artist, albumName) {
        return new Promise((resolve, reject) => {
            const logBox = document.getElementById(`log-${collectionId}`);

            (async () => {
                try {
                    const response = await fetch("http://localhost:8000/albums/rename-folder", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        credentials: "include",
                        body: JSON.stringify({
                            artist: artist,
                            album_name: albumName,
                            new_artist: artist,
                            new_album_name: albumName
                        })
                    });

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let buffer = "";

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        buffer += decoder.decode(value);
                        const lines = buffer.split("\n");
                        buffer = lines.pop() || "";

                        for (const line of lines) {
                            if (!line.trim().startsWith("data: ")) continue;

                            const content = line.replace("data: ", "").trim();
                            if (!content) continue;

                            if (content === "[DONE]") {
                                resolve();
                                return;
                            }

                            if (content.startsWith("[ERROR]")) {
                                reject(new Error(content));
                                return;
                            }

                            logBox.textContent += content + "\n";
                            downloadLogs[collectionId] = logBox.textContent;
                            logBox.scrollTop = logBox.scrollHeight;
                        }
                    }
                } catch (err) {
                    reject(err);
                }
            })();
        });
    }
